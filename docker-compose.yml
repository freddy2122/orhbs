services:
  db:
    image: postgres:16-alpine
    container_name: orhsb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orhsb
      POSTGRES_USER: orhsb
      POSTGRES_PASSWORD: orhsb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
