# Blueprint Render — déploiement backend ORHS Bénin
# Docs : https://render.com/docs/blueprint-spec

services:
  - type: web
    name: orhsb-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: orhsb-db
          property: connectionString
      # À renseigner après déploiement Vercel (ex. https://orhsb.vercel.app)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Optionnel : n'ajouter que si les previews Vercel doivent appeler l'API.
      # Toujours ancrer sur le nom du projet, jamais un simple ".*\.vercel\.app"
      # (ex. ^https://orhsb-[a-z0-9-]+\.vercel\.app$) — un pattern trop large
      # laisse n'importe quel autre projet Vercel rejouer les cookies d'un
      # utilisateur connecté (CORS_ALLOW_CREDENTIALS est activé).
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_PUBLIC_URL
        sync: false
      # Anti brute-force sur /api/auth/login/ — tentatives par IP, réussies ou non.
      - key: DJANGO_LOGIN_THROTTLE_RATE
        value: "5/min"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        value: "ORHS Bénin <noreply@orhsb.bj>"

  - type: cron
    name: orhsb-jobs
    runtime: python
    rootDir: backend
    schedule: "0 6 * * *"
    buildCommand: ./build.sh
    startCommand: python manage.py run_scheduled_jobs
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: orhsb-api
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: orhsb-db
          property: connectionString
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        value: "ORHS Bénin <noreply@orhsb.bj>"

databases:
  - name: orhsb-db
    plan: free
    databaseName: orhsb
    user: orhsb
