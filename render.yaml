# Blueprint Render — déploiement backend ORHS Bénin
# Docs : https://render.com/docs/blueprint-spec

services:
  - type: web
    name: orhsb-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: orhsb-db
          property: connectionString
      # À renseigner après déploiement Vercel (ex. https://orhsb.vercel.app)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

databases:
  - name: orhsb-db
    plan: free
    databaseName: orhsb
    user: orhsb
